name: CI Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra test

      - name: Run tests with pytest
        run: |
          cd backend
          uv run python -m pytest tests/ -v --tb=short

      - name: Check test coverage (informational)
        run: |
          cd backend
          uv run python -m pytest tests/ --tb=short || echo "Coverage check completed"
